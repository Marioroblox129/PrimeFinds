<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PrimeFinds</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo">
            <span class="brand">PrimeFinds</span>
        </div>

        <div class="nav-right">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('cart') }}">Cart</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 PrimeFinds — All rights reserved</p>
    </footer>
</body>
</html>
