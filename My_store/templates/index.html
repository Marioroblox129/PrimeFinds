{% extends "layout.html" %}
{% block content %}

<h1 class="page-title">Discover Trending Products</h1>

<div class="product-grid">
    {% for p in products %}
    <div class="product-card">
        <img src="{{ p.image }}" class="product-img">
        <h3>{{ p.name }}</h3>
        <p class="price">${{ "%.2f"|format(p.price) }}</p>
        <a href="{{ url_for('product', id=p.id) }}" class="btn">View</a>
    </div>
    {% endfor %}
</div>

{% endblock %}
